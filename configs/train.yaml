# Параметры обучения. Путь к данным здесь не задаётся: его читают из DATA_DIR.

data:
  split_seed: 42
  split_manifest: splits/split_manifest.json
  # Снимки лежат в $DATA_DIR/filtered. Сам каталог задаёт только окружение.
  image_subdir: filtered
  preprocess_versions:
    - v1_baseline
    - v2_augmented

model:
  architecture: mobilenet_v2
  num_classes: 8
  image_size: 224

train:
  # Потолок маленький: pretrained-веса и CPU. Ранний останов включает только опыт 3.
  epochs: 4
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 2

augmentations:
  # На train — случайная версия B, на val — детерминированная версия A.
  train_version: v2_augmented
  eval_version: v1_baseline
